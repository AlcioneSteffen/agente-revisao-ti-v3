<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<body style="margin:0;padding:0">
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const CHECKLIST = {
  ETP: [
    { id: "etp1",  item: "Descrição da necessidade da contratação",             ref: "Art. 18, I, Lei 14.133/2021" },
    { id: "etp2",  item: "Estimativa de quantidades e prazos",                  ref: "Art. 18, VI, Lei 14.133/2021" },
    { id: "etp3",  item: "Levantamento de soluções de mercado (make or buy)",   ref: "IN SGD/ME 94/2022, Art. 10" },
    { id: "etp4",  item: "Análise de riscos da contratação",                    ref: "Art. 18, X, Lei 14.133/2021" },
    { id: "etp5",  item: "Estimativa de valor da contratação",                  ref: "Art. 18, VII, Lei 14.133/2021" },
    { id: "etp6",  item: "Requisitos de habilitação técnica indicados",         ref: "Art. 18, IX, Lei 14.133/2021" },
    { id: "etp7",  item: "Alinhamento ao PDTIC do órgão",                      ref: "Resolução CNJ 468/2022" },
    { id: "etp8",  item: "Viabilidade da contratação demonstrada",              ref: "Art. 18, XI, Lei 14.133/2021" },
    { id: "etp9",  item: "Descrição da solução como um todo",                   ref: "IN SGD/ME 94/2022, Art. 10, III" },
    { id: "etp10", item: "Justificativa para parcelamento ou não do objeto",    ref: "Art. 40, §1º, Lei 14.133/2021" },
    { id: "etp11", item: "Análise de impacto na segurança da informação",       ref: "Resolução CNJ 468/2022 e Res. CNJ 616/2025" },
    { id: "etp12", item: "Adequação às disposições da LGPD",                   ref: "Lei 13.709/2018" },
    { id: "etp13", item: "Conformidade com o Guia STIC v4.0",                  ref: "Guia STIC/CNJ v4.0" },
  ],
  MGR: [
    { id: "mgr1",  item: "Identificação e descrição de cada risco",             ref: "Art. 22, Lei 14.133/2021" },
    { id: "mgr2",  item: "Probabilidade de ocorrência (alta/média/baixa)",      ref: "Acórdão TCU 1.280/2019" },
    { id: "mgr3",  item: "Impacto potencial de cada risco",                     ref: "Acórdão TCU 1.280/2019" },
    { id: "mgr4",  item: "Ações preventivas definidas",                         ref: "Art. 22, §1º, Lei 14.133/2021" },
    { id: "mgr5",  item: "Ações de contingência definidas",                     ref: "Art. 22, §1º, Lei 14.133/2021" },
    { id: "mgr6",  item: "Responsável por cada risco identificado",             ref: "IN SGD/ME 94/2022" },
    { id: "mgr7",  item: "Alocação entre contratante e contratado",             ref: "Art. 22, §3º, Lei 14.133/2021" },
    { id: "mgr8",  item: "Riscos de segurança da informação contemplados",      ref: "Resolução CNJ 468/2022 e Res. CNJ 616/2025" },
    { id: "mgr9",  item: "Riscos relacionados à LGPD considerados",            ref: "Lei 13.709/2018" },
    { id: "mgr10", item: "Matriz de riscos prevista no contrato",               ref: "Acórdão TCU 1.280/2019" },
  ],
  TR: [
    { id: "tr1",  item: "Definição precisa e clara do objeto",                  ref: "Art. 6º, XXIII e Art. 40, I, Lei 14.133/2021" },
    { id: "tr2",  item: "Fundamentação e referência ao ETP",                   ref: "Art. 40, II, Lei 14.133/2021" },
    { id: "tr3",  item: "Modelo de execução do objeto detalhado",              ref: "Art. 40, VI, Lei 14.133/2021" },
    { id: "tr4",  item: "Modelo de gestão do contrato definido",               ref: "Art. 40, VII, Lei 14.133/2021" },
    { id: "tr5",  item: "Critérios de medição e pagamento objetivos",          ref: "Art. 40, VIII, Lei 14.133/2021" },
    { id: "tr6",  item: "Prazo e forma de entrega especificados",              ref: "Art. 40, IV, Lei 14.133/2021" },
    { id: "tr7",  item: "Ausência de exigência de marca/modelo específico",    ref: "Art. 41, §1º, Lei 14.133/2021" },
    { id: "tr8",  item: "Habilitação técnica proporcional ao objeto",          ref: "Súmula TCU 272" },
    { id: "tr9",  item: "SLAs (níveis de serviço) mensuráveis definidos",      ref: "Acórdão TCU 1.827/2018" },
    { id: "tr10", item: "Designação de fiscal técnico, setorial e administrativo", ref: "Art. 117, Lei 14.133/2021" },
    { id: "tr11", item: "Critérios de sustentabilidade previstos",             ref: "Art. 40, III, Lei 14.133/2021" },
    { id: "tr12", item: "Adequação orçamentária demonstrada",                  ref: "Art. 40, XI, Lei 14.133/2021" },
    { id: "tr13", item: "Disposições sobre LGPD e segurança da informação",   ref: "Lei 13.709/2018 e Res. CNJ 468/2022" },
    { id: "tr14", item: "Diferenciação entre vigência da ata e prazo contratual (se SRP)", ref: "Decreto 11.462/2023" },
    { id: "tr15", item: "Critério de seleção do fornecedor definido",          ref: "Art. 40, X, Lei 14.133/2021" },
  ]
};

const SYSTEM_PROMPT = (tipo) => `Você é revisor técnico-normativo especializado em contratações de TIC no TRF2 (Tribunal Regional Federal da 2ª Região).
Analise o artefato ${tipo} à luz de: Lei 14.133/2021; Res. CNJ 468/2022; Res. CNJ 616/2025; IN SGD/ME 94/2022; Guia STIC/CNJ v4.0; LGPD; entendimentos do TCU.

REGRA FUNDAMENTAL: O TRF2 utiliza formulários padrão aprovados pela administração. Avalie EXCLUSIVAMENTE a qualidade e completude do conteúdo preenchido nos campos que estão no artefato submetido. NUNCA aponte como não conformidade ou fragilidade a ausência de informações que não façam parte do formulário padrão daquele artefato.

REGRAS ESPECÍFICAS POR ARTEFATO:
- ETP: Contém necessidades, estimativa de demanda, análise de soluções, TCO, descrição da solução, estimativa de custo e declaração de viabilidade. NÃO cobrar: classificação orçamentária, pesquisa formal de preços (fase posterior), critérios de habilitação, modalidade de licitação, SLAs, NSE, glosas.
- MGR: Contém parâmetros escalares, identificação/análise de riscos, tratamento de riscos e acompanhamento. NÃO cobrar: classificação orçamentária, pesquisa de preços, especificações técnicas.
- TR: Contém todas as cláusulas contratuais incluindo classificação orçamentária (seção 37). É o ÚNICO artefato onde classificação orçamentária deve ser verificada.

PESQUISA DE PREÇOS NO ETP: O TRF2 realiza pesquisa formal APÓS conclusão de todos os artefatos, em documento separado. Valor estimado de referência no ETP é suficiente — NÃO apontar como falha.

CLASSIFICAÇÃO ORÇAMENTÁRIA TRF2 (verificar apenas no TR):
Capital (tombados): 44.90.52.x equipamentos; 44.90.40.x software/serviços capital.
Corrente (consumo/serviços): 33.90.40.x serviços TIC; 33.90.30.17 materiais TIC não tombados (mouse, teclado, webcam, hub USB, cabo HDMI, etc.). Nuvem IaaS/PaaS/SaaS é SEMPRE corrente (33.90.40.17/18/19).

POSTURA: Crítica preventiva. Identifique fragilidades reais no conteúdo preenchido. Cite TCU quando pertinente. Indique consequência prática de cada fragilidade. Revisão gramatical obrigatória e exaustiva.

Responda SOMENTE com JSON válido, sem texto fora do JSON, sem markdown:
{"resumo":"2 frases","pontuacao":0,"nao_conformidades":[{"titulo":"","descricao":"","fundamento":"","consequencia":"","sugestao":""}],"pontos_atencao":[{"titulo":"","descricao":"","fundamento":"","sugestao":""}],"sugestoes_aprimoramento":[{"titulo":"","descricao":""}],"revisao_gramatical":{"status":"ERROS_ENCONTRADOS","declaracao":"","ocorrencias":[{"trecho_original":"","problema":"","correcao":""}]},"proximos_passos":["","",""],"parecer":""}
LIMITES: nao_conformidades max 8 (campos max 220 chars); pontos_atencao max 5 (max 200 chars); sugestoes max 5 (max 200 chars); ocorrencias max 6; proximos_passos exatamente 3 (max 150 chars); parecer max 600 chars.`;

const PROGRESS_STEPS = [
  { label: "Lendo o documento", icon: "📄" },
  { label: "Verificando normas aplicáveis", icon: "📚" },
  { label: "Identificando não conformidades", icon: "🔴" },
  { label: "Analisando pontos de atenção", icon: "⚠️" },
  { label: "Revisão gramatical e textual", icon: "✏️" },
  { label: "Elaborando parecer conclusivo", icon: "📜" },
];

function App() {
  const [tipoArtefato, setTipoArtefato] = useState("ETP");
  const [texto, setTexto] = useState("");
  const [checklist, setChecklist] = useState({});
  const [resultado, setResultado] = useState(null);
  const [loading, setLoading] = useState(false);
  const [erro, setErro] = useState("");
  const [aba, setAba] = useState("input");
  const [abaResultado, setAbaResultado] = useState("nao_conformidades");
  const [progressStep, setProgressStep] = useState(0);
  const [numeroProcesso, setNumeroProcesso] = useState("");
  const fileRef = useRef();
  const [chatMsgs, setChatMsgs] = useState([]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const chatEndRef = useRef();
  const [modoRevisaoCruzada, setModoRevisaoCruzada] = useState(false);
  const [artefatosCruzados, setArtefatosCruzados] = useState([]);
  const [resultadoCruzado, setResultadoCruzado] = useState(null);
  const [loadingCruzado, setLoadingCruzado] = useState(false);
  const fileRefCruzado = useRef();

  useEffect(() => {
    if (!window.pdfjsLib) {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; };
      document.head.appendChild(s);
    }
    if (!window.mammoth) {
      const s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js";
      document.head.appendChild(s2);
    }
    if (!window.docx) {
      const s3 = document.createElement("script");
      s3.src = "https://unpkg.com/docx@8.5.0/build/index.umd.js";
      document.head.appendChild(s3);
    }
  }, []);

  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatMsgs]);

  useEffect(() => {
    if (!loading) { setProgressStep(0); return; }
    setProgressStep(0);
    const interval = setInterval(() => {
      setProgressStep(prev => {
        if (prev < PROGRESS_STEPS.length - 1) return prev + 1;
        clearInterval(interval);
        return prev;
      });
    }, 2200);
    return () => clearInterval(interval);
  }, [loading]);

  const extractDocx = async (file) => {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          if (!window.mammoth) { reject(new Error("Biblioteca mammoth ainda carregando. Aguarde 2s.")); return; }
          const result = await window.mammoth.extractRawText({ arrayBuffer: ev.target.result });
          resolve(result.value.trim());
        } catch (e) { reject(e); }
      };
      reader.readAsArrayBuffer(file);
    });
  };

  const extractPdf = async (file) => {
    const arrayBuffer = await file.arrayBuffer();
    const pdfjsLib = window.pdfjsLib;
    if (!pdfjsLib) throw new Error("Biblioteca PDF carregando. Aguarde 3s e tente novamente.");
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let full = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const ct = await page.getTextContent();
      full += `\n--- Página ${i} ---\n` + ct.items.map(x => x.str).join(" ");
    }
    if (full.trim().length < 50) throw new Error("PDF digitalizado (imagem). Cole o texto manualmente.");
    return full.trim();
  };

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    setErro("");
    try {
      if (file.type === "text/plain") {
        setTexto(await file.text());
      } else if (file.type === "application/pdf") {
        setTexto("⏳ Extraindo texto do PDF...");
        setTexto(await extractPdf(file));
      } else if (
        file.name.endsWith(".docx") ||
        file.type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      ) {
        setTexto("⏳ Extraindo texto do DOCX...");
        setTexto(await extractDocx(file));
      } else {
        setErro("Formato não suportado. Use PDF, DOCX ou TXT.");
      }
    } catch (err) {
      setTexto("");
      setErro(err.message);
    }
  };

  const handleFileCruzado = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    const tiposValidos = ["ETP", "MGR", "TR"];
    let tipoDetectado = "";
    const nome = file.name.toUpperCase();
    if (nome.includes("ETP")) tipoDetectado = "ETP";
    else if (nome.includes("MGR") || nome.includes("RISCO")) tipoDetectado = "MGR";
    else if (nome.includes("TR") || nome.includes("TERMO")) tipoDetectado = "TR";
    else {
      const resposta = window.prompt("Qual o tipo deste artefato?\nDigite: ETP, MGR ou TR");
      tipoDetectado = (resposta || "").toUpperCase().trim();
      if (!tiposValidos.includes(tipoDetectado)) { alert("Tipo inválido. Use ETP, MGR ou TR."); return; }
    }
    try {
      let textoArtefato = "";
      if (file.type === "text/plain") textoArtefato = await file.text();
      else if (file.type === "application/pdf") textoArtefato = await extractPdf(file);
      else if (file.name.endsWith(".docx")) textoArtefato = await extractDocx(file);
      if (!textoArtefato || textoArtefato.length < 50) { alert("Não foi possível extrair o texto. Cole manualmente."); return; }
      setArtefatosCruzados(prev => [...prev.filter(a => a.tipo !== tipoDetectado), { tipo: tipoDetectado, nome: file.name, texto: textoArtefato }]);
    } catch (err) { alert("Erro ao ler arquivo: " + err.message); }
  };

  const parseJSON = (raw) => {
    const clean = raw.replace(/```json|```/g, "").trim();
    try { return JSON.parse(clean); }
    catch {
      let fixed = clean;
      if ((fixed.match(/"/g) || []).length % 2) fixed += '"';
      const op = (fixed.match(/[\[{]/g) || []).length;
      const cl = (fixed.match(/[\]}]/g) || []).length;
      for (let i = 0; i < op - cl; i++) fixed += fixed.lastIndexOf("[") > fixed.lastIndexOf("{") ? "]" : "}";
      return JSON.parse(fixed);
    }
  };

  const analisar = async () => {
    if (!texto.trim()) { setErro("Cole ou carregue o texto do artefato para análise."); return; }
    setErro(""); setLoading(true); setResultado(null); setChatMsgs([]);
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 8000,
          system: SYSTEM_PROMPT(tipoArtefato),
          messages: [{ role: "user", content: `Analise este artefato ${tipoArtefato}:\n\n${texto.slice(0, 14000)}` }],
        }),
      });
      if (!resp.ok) { const ed = await resp.json().catch(() => ({})); setErro(`Erro da API (${resp.status}): ${ed?.error?.message || resp.statusText}`); return; }
      const data = await resp.json();
      if (data.error) { setErro(`Erro da API: ${data.error.message}`); return; }
      const raw = data.content?.map(c => c.text || "").join("") || "";
      if (!raw) { setErro("API não retornou conteúdo. Tente novamente."); return; }
      const parsed = parseJSON(raw);
      setResultado(parsed);
      setAba("resultado");
      setAbaResultado("nao_conformidades");
      setChatMsgs([{
        role: "assistant",
        content: `✅ Revisão concluída! Pontuação: **${parsed.pontuacao}/100**. Encontrei **${(parsed.nao_conformidades||[]).length} não conformidade(s)** e **${(parsed.pontos_atencao||[]).length} ponto(s) de atenção**.\n\nAgora você pode me fazer perguntas sobre a revisão, pedir aprofundamento em qualquer ponto ou tirar dúvidas sobre as normas aplicadas.`
      }]);
    } catch (e) { setErro(`Erro de conexão: ${e.message}`); }
    finally { setLoading(false); }
  };

  const analisarCruzado = async () => {
    if (artefatosCruzados.length < 2) { alert("Carregue pelo menos 2 artefatos para a revisão cruzada."); return; }
    setLoadingCruzado(true); setResultadoCruzado(null);
    const resumo = artefatosCruzados.map(a => `=== ${a.tipo} (${a.nome}) ===\n${a.texto.slice(0, 6000)}`).join("\n\n");
    const prompt = `Você é revisor técnico-normativo especializado em contratações de TIC no TRF2.
Analise os seguintes artefatos em conjunto e identifique INCOERÊNCIAS, CONTRADIÇÕES e LACUNAS entre eles:
${resumo}
Responda SOMENTE com JSON válido e fechado:
{
  "resumo_geral": "2 frases",
  "artefatos_analisados": ["ETP","MGR","TR"],
  "incoerencias": [{"titulo":"","artefatos_envolvidos":[""],"descricao":"","recomendacao":""}],
  "ausencias_cruzadas": [{"titulo":"","artefato_com_lacuna":"","artefato_com_informacao":"","descricao":""}],
  "pontos_positivos": [{"titulo":"","descricao":""}],
  "parecer_cruzado": ""
}
LIMITES: incoerencias max 5; ausencias_cruzadas max 4; pontos_positivos max 3; cada campo max 200 chars; parecer_cruzado max 500 chars.`;
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 4000, messages: [{ role: "user", content: prompt }] })
      });
      const data = await resp.json();
      const raw = (data.content || []).map(c => c.text || "").join("");
      setResultadoCruzado(parseJSON(raw));
    } catch (err) { alert("Erro na análise cruzada: " + err.message); }
    setLoadingCruzado(false);
  };

  const enviarChat = async () => {
    const msg = chatInput.trim();
    if (!msg || chatLoading) return;
    setChatInput("");
    const novasMsg = [...chatMsgs, { role: "user", content: msg }];
    setChatMsgs(novasMsg);
    setChatLoading(true);
    try {
      const contextRevisao = resultado ? `
CONTEXTO — Revisão do artefato ${tipoArtefato} já realizada:
Pontuação: ${resultado.pontuacao}/100
Resumo: ${resultado.resumo}
Não conformidades: ${(resultado.nao_conformidades||[]).map(n => n.titulo).join("; ")}
Pontos de atenção: ${(resultado.pontos_atencao||[]).map(p => p.titulo).join("; ")}
Parecer: ${resultado.parecer}
Trecho do documento: ${texto.slice(0, 4000)}
` : "";
      const systemChat = `Você é o revisor técnico-normativo do TRF2 especializado em contratações de TIC.
Acabou de realizar uma revisão completa e agora responde dúvidas sobre a revisão, aprofunda apontamentos e explica normas (Lei 14.133/2021, Res. CNJ 468/2022, Res. CNJ 616/2025, IN SGD/ME 94/2022, Guia STIC v4.0, LGPD, TCU).
Seja preciso, técnico, fundamentado e objetivo.
${contextRevisao}`;
      const msgs = novasMsg.map(m => ({ role: m.role, content: m.content }));
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 2000, system: systemChat, messages: msgs })
      });
      const data = await resp.json();
      const resposta = (data.content || []).map(c => c.text || "").join("").trim();
      setChatMsgs(prev => [...prev, { role: "assistant", content: resposta }]);
    } catch (e) { setChatMsgs(prev => [...prev, { role: "assistant", content: `Erro: ${e.message}` }]); }
    setChatLoading(false);
  };

  const exportar = () => {
    if (!resultado) return;
    const nc = resultado.nao_conformidades || [];
    const pa = resultado.pontos_atencao || [];
    const sa = resultado.sugestoes_aprimoramento || [];
    const rg = resultado.revisao_gramatical || {};
    const ps = resultado.proximos_passos || [];
    const proc = numeroProcesso ? `<div style="font-size:12px;color:#c8a96e;margin-top:4px">Processo: ${numeroProcesso}</div>` : "";
    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Parecer ${tipoArtefato}</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#1a1a2e;background:#fff;padding:30px}
.hdr{background:linear-gradient(135deg,#1e3a5f,#0f172a);color:#fff;padding:24px 32px;border-radius:8px;margin-bottom:20px}
.score{display:flex;gap:16px;align-items:center;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:16px}
.num{font-size:44px;font-weight:900;color:#2c5f85;line-height:1}
.card{border-radius:6px;border:1px solid #e2e8f0;padding:14px;margin-bottom:8px}
.nc{border-left:4px solid #ef4444}.pa{border-left:4px solid #f59e0b}.sa{border-left:4px solid #6366f1}.rg{border-left:4px solid #10b981}
.ct{font-weight:700;font-size:13px;margin-bottom:6px}.cl{font-size:10px;color:#6b7280;margin-bottom:2px;font-weight:600;text-transform:uppercase}
.cx{font-size:12px;color:#374151;margin-bottom:4px}h2{font-size:13px;font-weight:700;color:#1e3a5f;margin:20px 0 8px;border-bottom:1px solid #e2e8f0;padding-bottom:4px}
.parecer{background:#f0f4ff;border:1px solid #c7d2fe;border-radius:8px;padding:16px;margin-top:16px}

      </div>
      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "0 40px 32px 40px" }}>
        <input ref={fileRef} type="file" accept=".txt,.pdf,.docx" onChange={handleFile} style={{ display: "none" }} />
        <input ref={fileRefCruzado} type="file" accept=".txt,.pdf,.docx" onChange={handleFileCruzado} style={{ display: "none" }} />
        {!modoRevisaoCruzada && (
          <div style={{ display: "flex", borderBottom: "1px solid #c8dcea", overflowX: "auto" }}>
            <TabBtn label={texto ? `📄 ${tipoArtefato} carregado` : "📝 Documento"} active={aba === "input"} onClick={() => setAba("input")} />
            <TabBtn label={`✅ Checklist (${totalChecked}/${checklistItems.length})`} active={aba === "checklist"} onClick={() => setAba("checklist")} />
            <TabBtn label="🔍 Resultado da Análise" active={aba === "resultado"} onClick={() => setAba("resultado")} />
          </div>
        )}
        {!modoRevisaoCruzada && aba === "input" && (
          <div style={{ background: "#ffffff", borderRadius: "0 0 12px 12px", padding: 28, border: "1px solid #c8dcea", borderTop: "none" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ background: "#1e3a5f", color: "#c8a96e", padding: "4px 14px", borderRadius: 20, fontSize: 12, fontFamily: "sans-serif", fontWeight: "bold" }}>{tipoArtefato}</span>
                <span style={{ color: "#334e62", fontFamily: "sans-serif", fontSize: 13 }}>{texto ? "✅ Arquivo carregado — clique em Analisar" : "Nenhum arquivo carregado ainda"}</span>
              </div>
              {texto && <button onClick={() => { setTexto(""); setResultado(null); setChatMsgs([]); }} style={{ background: "none", border: "1px solid #e2e8f0", color: "#94a3b8", padding: "4px 12px", borderRadius: 6, cursor: "pointer", fontSize: 12, fontFamily: "sans-serif" }}>✕ Limpar</button>}
            </div>
            <textarea value={texto} onChange={e => setTexto(e.target.value)}
              placeholder={`Selecione o tipo de artefato acima e carregue o arquivo (PDF, DOCX ou TXT),\nou cole o texto do ${tipoArtefato} diretamente aqui...`}
              style={{ width: "100%", minHeight: 300, background: "#f5fafd", border: "1px solid #b8d4e8", borderRadius: 8, color: "#1a3a52", padding: 16, fontSize: 14, fontFamily: "sans-serif", resize: "vertical", boxSizing: "border-box", lineHeight: 1.6 }} />
            {erro && <div style={{ color: "#f87171", fontFamily: "sans-serif", fontSize: 13, marginTop: 8 }}>⚠️ {erro}</div>}
            {texto && !erro && <div style={{ color: "#7a9db8", fontFamily: "sans-serif", fontSize: 12, marginTop: 6 }}>📄 {texto.length.toLocaleString()} caracteres carregados</div>}
            <div style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 8 }}>
              <label style={{ fontFamily: "sans-serif", fontSize: 12, color: "#64748b", whiteSpace: "nowrap" }}>Nº do Processo (opcional):</label>
              <input value={numeroProcesso} onChange={e => setNumeroProcesso(e.target.value)} placeholder="Ex: 0001234-56.2025.4.02.0000"
                style={{ padding: "7px 12px", borderRadius: 6, border: "1px solid #b8d4e8", fontSize: 12, fontFamily: "sans-serif", color: "#1a3a52", width: 240 }} />
            </div>
            <div style={{ marginTop: 20, display: "flex", justifyContent: "flex-end" }}>
              <button onClick={analisar} disabled={loading || !texto.trim()}
                style={{ background: loading || !texto.trim() ? "#a8c8e0" : "linear-gradient(135deg, #2c5f85, #1a3a5c)", color: "#ffffff", border: "none", padding: "14px 44px", borderRadius: 8, cursor: loading || !texto.trim() ? "not-allowed" : "pointer", fontWeight: "bold", fontSize: 15, fontFamily: "sans-serif" }}>
                {loading ? "⏳ Analisando…" : `🔍 Analisar ${tipoArtefato}`}
              </button>
            </div>
          </div>
        )}
        {!modoRevisaoCruzada && aba === "checklist" && (
          <div style={{ background: "#ffffff", borderRadius: "0 0 12px 12px", padding: 28, border: "1px solid #c8dcea", borderTop: "none" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <div style={{ color: "#94a3b8", fontFamily: "sans-serif", fontSize: 14 }}>Verificação manual — {tipoArtefato}</div>
              <div style={{ background: totalChecked === checklistItems.length ? "#dcfce7" : "#ddeaf5", color: totalChecked === checklistItems.length ? "#166534" : "#2c5f85", padding: "6px 16px", borderRadius: 20, fontSize: 13, fontFamily: "sans-serif", fontWeight: "bold" }}>
                {totalChecked}/{checklistItems.length} verificados
              </div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {checklistItems.map(item => (
                <div key={item.id} onClick={() => toggleCheck(item.id)} style={{ display: "flex", alignItems: "flex-start", gap: 14, padding: "13px 16px", borderRadius: 8, cursor: "pointer", background: checklist[item.id] ? "#f0fdf4" : "#fafcfe", border: `1px solid ${checklist[item.id] ? "#86efac" : "#c8dcea"}` }}>
                  <div style={{ width: 20, height: 20, borderRadius: 4, border: `2px solid ${checklist[item.id] ? "#10b981" : "#475569"}`, background: checklist[item.id] ? "#10b981" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 2 }}>
                    {checklist[item.id] && <span style={{ color: "#fff", fontSize: 12 }}>✓</span>}
                  </div>
                  <div>
                    <div style={{ color: checklist[item.id] ? "#166534" : "#1a3a52", fontFamily: "sans-serif", fontSize: 13 }}>{item.item}</div>
                    <div style={{ color: "#7a9db8", fontFamily: "sans-serif", fontSize: 11, marginTop: 2 }}>{item.ref}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
        {!modoRevisaoCruzada && aba === "resultado" && (
          <div style={{ background: "#ffffff", borderRadius: "0 0 12px 12px", padding: 28, border: "1px solid #c8dcea", borderTop: "none" }}>
            {!resultado && !loading && (
              <div style={{ textAlign: "center", padding: "60px 20px", color: "#475569", fontFamily: "sans-serif" }}>
                <div style={{ fontSize: 48, marginBottom: 16 }}>🔍</div>
                <div style={{ fontSize: 16 }}>Nenhuma análise realizada ainda.</div>
                <div style={{ fontSize: 13, marginTop: 8 }}>Vá para a aba Documento e clique em Analisar.</div>
              </div>
            )}
            {loading && (
              <div style={{ padding: "40px 20px" }}>
                <div style={{ textAlign: "center", marginBottom: 32 }}>
                  <div style={{ fontSize: 42, marginBottom: 12 }}>🔍</div>
                  <div style={{ fontSize: 16, fontFamily: "sans-serif", color: "#1a3a52", fontWeight: "bold", marginBottom: 4 }}>Realizando análise técnico-normativa…</div>
                  <div style={{ fontSize: 13, color: "#94a3b8", fontFamily: "sans-serif" }}>Lei 14.133/2021 · Res. CNJ 468/2022 · Res. CNJ 616/2025 · Guia STIC v4.0 · TCU · LGPD</div>
                </div>
                <div style={{ maxWidth: 520, margin: "0 auto" }}>
                  {PROGRESS_STEPS.map((step, idx) => {
                    const done = idx < progressStep;
                    const active = idx === progressStep;
                    return (
                      <div key={idx} style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 0", borderBottom: idx < PROGRESS_STEPS.length - 1 ? "1px solid #f0f4f8" : "none" }}>
                        <div style={{ width: 36, height: 36, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, background: done ? "#dcfce7" : active ? "#ddeaf5" : "#f1f5f9", border: done ? "2px solid #86efac" : active ? "2px solid #93c5fd" : "2px solid #e2e8f0", transition: "all 0.4s", flexShrink: 0 }}>
                          {done ? "✓" : step.icon}
                        </div>
                        <div style={{ fontFamily: "sans-serif", fontSize: 13, color: done ? "#166534" : active ? "#1e40af" : "#94a3b8", fontWeight: active ? "bold" : "normal" }}>
                          {step.label}{active && <span style={{ marginLeft: 8 }}>…</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {resultado && !loading && (() => {
              const nc = resultado.nao_conformidades || [];
              const pa = resultado.pontos_atencao || [];
              const sa = resultado.sugestoes_aprimoramento || [];
              const rg = resultado.revisao_gramatical || {};
              const ps = resultado.proximos_passos || [];
              return (
                <>
                  <div style={{ display: "flex", gap: 20, marginBottom: 24, flexWrap: "wrap" }}>
                    <div style={{ background: "#eef6fb", border: "1px solid #a8c8e0", borderRadius: 12, padding: "18px 28px", textAlign: "center", minWidth: 110 }}>
                      <div style={{ fontSize: 52, fontWeight: "bold", color: "#2c5f85", lineHeight: 1 }}>{resultado.pontuacao}</div>
                      <div style={{ color: "#64748b", fontSize: 11, fontFamily: "sans-serif", marginTop: 4 }}>/ 100</div>
                    </div>
                    <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", gap: 10 }}>
                      <div style={{ color: "#1a3a52", fontSize: 14, fontFamily: "sans-serif", lineHeight: 1.6 }}>{resultado.resumo}</div>
                      {numeroProcesso && <div style={{ color: "#64748b", fontFamily: "sans-serif", fontSize: 12 }}>📁 Processo: <strong>{numeroProcesso}</strong></div>}
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        {badge("#fee2e2", "#991b1b", `🔴 ${nc.length} não conformidade(s)`)}
                        {badge("#fef3c7", "#92400e", `${pa.length} ponto(s) de atenção`)}
                        {badge("#e0e7ff", "#3730a3", `💡 ${sa.length} sugestão(ões)`)}
                        {badge(rg.status==="SEM_ERROS"?"#d1fae5":"#fef3c7", rg.status==="SEM_ERROS"?"#065f46":"#92400e", rg.status==="SEM_ERROS"?"✅ Sem erros gramaticais":`✏️ ${(rg.ocorrencias||[]).length} ocorrência(s)`)}
                      </div>
                    </div>
                  </div>
                  <div style={{ display: "flex", borderBottom: "1px solid #c8dcea", marginBottom: 20, overflowX: "auto" }}>
                    {[["nao_conformidades",`🔴 Não Conformidades (${nc.length})`],["pontos_atencao",`Pontos de Atenção (${pa.length})`],["sugestoes",`💡 Sugestões (${sa.length})`],["gramatical",`✏️ Gramatical (${(rg.ocorrencias||[]).length})`],["parecer","📜 Parecer Final"]].map(([id,label]) => (
                      <TabBtn key={id} label={label} active={abaResultado===id} onClick={() => setAbaResultado(id)} />
                    ))}
                  </div>
                  {abaResultado==="nao_conformidades" && (nc.length===0 ? <div style={{ color: "#6ee7b7", fontFamily: "sans-serif", padding: "20px 0" }}>✅ Nenhuma não conformidade crítica identificada.</div> : nc.map((p,i) => <CardItem key={i} cor="#ef4444" badgeBg="#fee2e2" badgeColor="#991b1b" badgeText="NÃO CONFORME" item={p} />))}
                  {abaResultado==="pontos_atencao" && (pa.length===0 ? <div style={{ color: "#6ee7b7", fontFamily: "sans-serif", padding: "20px 0" }}>✅ Nenhum ponto de atenção identificado.</div> : pa.map((p,i) => <CardItem key={i} cor="#f59e0b" badgeBg="#fef3c7" badgeColor="#92400e" badgeText="ATENÇÃO" item={p} />))}
                  {abaResultado==="sugestoes" && (sa.length===0 ? <div style={{ color: "#94a3b8", fontFamily: "sans-serif", padding: "20px 0" }}>Nenhuma sugestão adicional.</div> : sa.map((p,i) => (
                    <div key={i} style={{ background: "#f8fbfd", borderLeft: "4px solid #6366f1", borderRadius: "0 8px 8px 0", padding: 18, marginBottom: 12 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>{badge("#e0e7ff","#3730a3","SUGESTÃO")}<span style={{ color: "#1a3a52", fontWeight: "bold", fontFamily: "sans-serif", fontSize: 14 }}>{p.titulo}</span></div>
                      <div style={{ color: "#334e62", fontFamily: "sans-serif", fontSize: 13, lineHeight: 1.6 }}>{p.descricao}</div>
                    </div>
                  )))}
                  {abaResultado==="gramatical" && (
                    <div>
                      <div style={{ background: rg.status==="SEM_ERROS"?"#f0fdf4":"#fffbeb", border: `1px solid ${rg.status==="SEM_ERROS"?"#86efac":"#fcd34d"}`, borderRadius: 8, padding: 16, marginBottom: 16 }}>
                        <div style={{ color: rg.status==="SEM_ERROS"?"#166534":"#92400e", fontFamily: "sans-serif", fontSize: 13, fontStyle: "italic" }}>{rg.status==="SEM_ERROS"?"✅":"✏️"} {rg.declaracao}</div>
                      </div>
                      {(rg.ocorrencias||[]).map((o,i) => (
                        <div key={i} style={{ background: "#f8fbfd", borderLeft: "4px solid #10b981", borderRadius: "0 8px 8px 0", padding: 18, marginBottom: 12 }}>
                          <div style={{ color: "#64748b", fontFamily: "sans-serif", fontSize: 11, fontWeight: "bold", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Trecho Original</div>
                          <div style={{ background: "rgba(239,68,68,0.1)", border: "1px solid rgba(239,68,68,0.2)", borderRadius: 4, padding: "6px 10px", fontFamily: "monospace", fontSize: 13, marginBottom: 10 }}>"{o.trecho_original}"</div>
                          <div style={{ color: "#64748b", fontFamily: "sans-serif", fontSize: 11, fontWeight: "bold", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Problema</div>
                          <div style={{ color: "#94a3b8", fontFamily: "sans-serif", fontSize: 13, marginBottom: 10 }}>{o.problema}</div>
                          <div style={{ color: "#64748b", fontFamily: "sans-serif", fontSize: 11, fontWeight: "bold", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Correção Sugerida</div>
                          <div style={{ background: "rgba(16,185,129,0.1)", border: "1px solid rgba(16,185,129,0.2)", borderRadius: 4, padding: "6px 10px", fontFamily: "monospace", fontSize: 13 }}>"{o.correcao}"</div>
                        </div>
                      ))}
                    </div>
                  )}
                  {abaResultado==="parecer" && (
                    <div>
                      <div style={{ background: "#eef4fb", border: "1px solid #a8c0d8", borderRadius: 10, padding: 24, marginBottom: 20 }}>
                        <div style={{ color: "#2c5f85", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", fontFamily: "sans-serif", marginBottom: 14 }}>Parecer Formal Conclusivo</div>
                        <div style={{ color: "#1a3a52", fontFamily: "sans-serif", fontSize: 14, lineHeight: 1.9, whiteSpace: "pre-wrap" }}>{resultado.parecer}</div>
                      </div>
                      {ps.length > 0 && (
                        <div style={{ background: "#f5f9fc", border: "1px solid #c0d8ea", borderRadius: 10, padding: 20, marginBottom: 20 }}>
                          <div style={{ color: "#2c5f85", fontSize: 10, letterSpacing: 2, textTransform: "uppercase", fontFamily: "sans-serif", marginBottom: 14 }}>Próximos Passos</div>
                          {ps.map((p,i) => (
                            <div key={i} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderBottom: i < ps.length-1 ? "1px solid #e2e8f0" : "none" }}>
                              <div style={{ background: "#2c5f85", color: "#fff", borderRadius: "50%", width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: "bold", fontFamily: "sans-serif", flexShrink: 0 }}>{i+1}</div>
                              <div style={{ color: "#334e62", fontFamily: "sans-serif", fontSize: 13, lineHeight: 1.6 }}>{p}</div>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <label style={{ fontFamily: "sans-serif", fontSize: 12, color: "#64748b", whiteSpace: "nowrap" }}>Nº do Processo:</label>
                          <input value={numeroProcesso} onChange={e => setNumeroProcesso(e.target.value)} placeholder="Ex: 0001234-56.2025.4.02.0000"
                            style={{ padding: "7px 12px", borderRadius: 6, border: "1px solid #b8d4e8", fontSize: 12, fontFamily: "sans-serif", color: "#1a3a52", width: 220 }} />
                        </div>
                        <div style={{ display: "flex", gap: 10 }}>
                          <button onClick={exportar} style={{ background: "linear-gradient(135deg, #2c5f85, #1a3a5c)", color: "#fff", border: "none", padding: "13px 22px", borderRadius: 8, cursor: "pointer", fontWeight: "bold", fontSize: 13, fontFamily: "sans-serif" }}>🖨️ Imprimir / Salvar PDF</button>
                          <button onClick={exportarWord} style={{ background: "linear-gradient(135deg, #1a5c3a, #0f3a22)", color: "#fff", border: "none", padding: "13px 22px", borderRadius: 8, cursor: "pointer", fontWeight: "bold", fontSize: 13, fontFamily: "sans-serif" }}>📄 Exportar Word (.docx)</button>
                        </div>
                      </div>
                    </div>
                  )}
                </>
              );
            })()}
          </div>
        )}
      </div>
      {resultado && !modoRevisaoCruzada && (
        <div style={{ maxWidth: 1100, margin: "0 auto", padding: "0 40px 32px 40px" }}>
          <div style={{ background: "#ffffff", border: "1px solid #c8dcea", borderRadius: "12px 12px 0 0", minHeight: 80, maxHeight: 420, overflowY: "auto", padding: "20px 24px", display: "flex", flexDirection: "column", gap: 14 }}>
            {chatMsgs.length === 0 && <div style={{ textAlign: "center", padding: "24px 0", color: "#94a3b8", fontFamily: "sans-serif", fontSize: 13 }}>Nenhuma mensagem ainda. Faça uma pergunta abaixo! 👇</div>}
            {chatMsgs.map((msg, i) => (
              <div key={i} style={{ display: "flex", justifyContent: msg.role==="user" ? "flex-end" : "flex-start", alignItems: "flex-end", gap: 8 }}>
                {msg.role==="assistant" && <div style={{ width: 28, height: 28, borderRadius: "50%", background: "linear-gradient(135deg,#1e3a5f,#0f172a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, flexShrink: 0 }}>⚖️</div>}
                <div style={{ maxWidth: "75%", padding: "11px 16px", borderRadius: msg.role==="user" ? "18px 18px 4px 18px" : "18px 18px 18px 4px", background: msg.role==="user" ? "linear-gradient(135deg, #2c5f85, #1a3a5c)" : "#f0f5fa", color: msg.role==="user" ? "#fff" : "#1a3a52", fontFamily: "sans-serif", fontSize: 13, lineHeight: 1.65, border: msg.role==="assistant" ? "1px solid #ddeaf5" : "none" }}>
                  {msg.content.split("**").map((part,j) => j%2===1 ? <strong key={j}>{part}</strong> : part)}
                </div>
                {msg.role==="user" && <div style={{ width: 28, height: 28, borderRadius: "50%", background: "#e2eaf2", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, flexShrink: 0 }}>👤</div>}
              </div>
            ))}
            {chatLoading && (
              <div style={{ display: "flex", alignItems: "flex-end", gap: 8 }}>
                <div style={{ width: 28, height: 28, borderRadius: "50%", background: "linear-gradient(135deg,#1e3a5f,#0f172a)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, flexShrink: 0 }}>⚖️</div>
                <div style={{ background: "#f0f5fa", border: "1px solid #ddeaf5", borderRadius: "18px 18px 18px 4px", padding: "11px 16px", fontFamily: "sans-serif", fontSize: 13, color: "#94a3b8" }}>● ● ●</div>
              </div>
            )}
            <div ref={chatEndRef} />
          </div>
          <div style={{ background: "#f8fafc", border: "1px solid #c8dcea", borderTop: "none", borderRadius: "0 0 12px 12px", padding: "14px 20px" }}>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <input value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={e => e.key==="Enter" && !e.shiftKey && enviarChat()} disabled={chatLoading}
                placeholder={`Perguntas sobre a revisão do ${tipoArtefato}, normas aplicadas, como corrigir fragilidades...`}
                style={{ flex: 1, padding: "12px 18px", borderRadius: 24, border: "1px solid #b8d4e8", fontFamily: "sans-serif", fontSize: 13, color: "#1a3a52", outline: "none", background: "#fff" }} />
              <button onClick={enviarChat} disabled={chatLoading || !chatInput.trim()}
                style={{ background: chatLoading || !chatInput.trim() ? "#a8c8e0" : "linear-gradient(135deg, #2c5f85, #1a3a5c)", color: "#fff", border: "none", width: 44, height: 44, borderRadius: "50%", cursor: chatLoading || !chatInput.trim() ? "not-allowed" : "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                ➤
              </button>
            </div>
          </div>
        </div>
      )}
      <div style={{ textAlign: "center", padding: "16px", color: "#7a9db8", fontSize: 11, fontFamily: "sans-serif" }}>
        Agente de Revisão de Artefatos de TIC v2 · Lei 14.133/2021 · IN SGD/ME 94/2022 · Res. CNJ 468/2022 · Res. CNJ 616/2025 · Guia STIC v4.0 · TCU · LGPD
        <br /><span style={{ color: "#a0b8cc", fontSize: 10 }}>Análise de caráter técnico-preventivo. Não substitui manifestação jurídica ou deliberação administrativa formal.</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
